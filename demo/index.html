<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>edirom-desktop demo</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/Edirom/edirom-core-web-components@7b6e1e6e3903fb405475561b90f2e036c1a310de/src/edirom-icon.js"></script>
    <script type="module" src="../edirom-desktop.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            font: 13px/1.3 helvetica, arial, verdana, sans-serif;
        }

        edirom-desktop {
            flex: 1;
            min-width: 0;
        }

        .fake-navigator {
            box-sizing: border-box;
            width: 250px;
            height: 500px;
            padding: 8px;
            background: #ffffff;
            border-left: 1px solid #999999;
            border-bottom: 1px solid #999999;
            color: #555555;
            overflow: auto;
            resize: vertical;
        }

        .action {
            font: inherit;
        }

        aside {
            display: flex;
            flex-direction: column;
            flex: 0 0 300px;
            background: #ffffff;
            border-left: 1px solid #999999;
        }

        aside h2 {
            margin: 0;
            padding: 6px 8px;
            font-size: 13px;
            background: #eeeeee;
            border-bottom: 1px solid #cccccc;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            font-size: 12px;
            border-bottom: 1px solid #cccccc;
        }

        .controls button,
        .controls select {
            font: inherit;
        }

        #metrics {
            margin: 0;
            padding: 4px 8px;
            font: 11px/1.4 ui-monospace, Menlo, monospace;
            border-bottom: 1px solid #cccccc;
        }

        #log {
            flex: 1;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            list-style: none;
            font: 11px/1.4 ui-monospace, Menlo, monospace;
        }

        #log li {
            padding: 3px 8px;
            border-bottom: 1px solid #eeeeee;
            word-break: break-all;
        }

        #log b {
            color: #1a5aa6;
        }

        .win {
            position: absolute;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #777777;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: left 0.4s, top 0.4s, width 0.4s, height 0.4s;
        }

        .win.active {
            border-color: #000000;
        }

        .win[hidden] {
            display: none;
        }

        .win header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: #cccccc;
            cursor: default;
        }

        .win.active header {
            background: #9fb7d0;
        }

        .win header span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .win header button {
            padding: 0 6px;
            font: inherit;
        }

        .win .body {
            flex: 1;
            padding: 8px;
            color: #555555;
            overflow: auto;
        }
    </style>
</head>
<body>
    <edirom-desktop
        works='[{"id":"freischuetz","title":"Der Freischütz"},{"id":"oberon","title":"Oberon"},{"id":"euryanthe","title":"Euryanthe"}]'
        active-work="freischuetz"
        show-clock>
        <div slot="workspace" id="workspace"></div>
        <div slot="navigator" class="fake-navigator">slot="navigator" (stands in for edirom-navigator, drag the corner to resize)</div>
        <button slot="topbar-actions" type="button" class="action">slot="topbar-actions"</button>
    </edirom-desktop>

    <aside>
        <h2>Demo controls</h2>
        <div class="controls">
            <button id="add-window" type="button">Add window</button>
            <button id="toggle-navigator" type="button">Toggle navigator</button>
            <label><input id="show-clock" type="checkbox" checked> Clock</label>
            <label><input id="show-language" type="checkbox"> Language button</label>
            <label><input id="stretch" type="checkbox"> Stretch wallpaper</label>
            <select id="wallpaper" aria-label="Wallpaper">
                <option value="">Default background</option>
                <option value="wallpaper.svg">Tiled pattern</option>
            </select>
            <select id="language" aria-label="Labels">
                <option value="en">English labels</option>
                <option value="de">German labels</option>
            </select>
            <button id="clear-log" type="button">Clear log</button>
        </div>
        <h2>desktop-resize</h2>
        <pre id="metrics"></pre>
        <h2>Events</h2>
        <ol id="log"></ol>
    </aside>

    <script type="module">
        import { CONCORDANCE_NAVIGATOR_KIND } from '../edirom-desktop.js';

        const desktop = document.querySelector('edirom-desktop');
        const workspace = document.getElementById('workspace');
        const navigator = document.querySelector('.fake-navigator');
        const log = document.getElementById('log');
        const windowElements = new Map();
        let zIndex = 0;

        const GERMAN = {
            home: 'Startseite', workSwitch: 'Werk auswählen', searchField: 'Suchbegriff', search: 'Suchen',
            sortGrid: 'Fenster im Raster anordnen', sortVertical: 'Fenster untereinander anordnen',
            sortHorizontal: 'Fenster nebeneinander anordnen', showMeasures: 'Taktzahlen anzeigen',
            showAnnotations: 'Anmerkungen anzeigen', concordanceNav: 'Konkordanznavigator',
            windowBar: 'Geöffnete Fenster', about: 'Über', help: 'Hilfe', languageSwitch: 'Sprache wechseln',
            windowMenu: 'Fensteraktionen', restore: 'Wiederherstellen', minimize: 'Minimieren',
            maximize: 'Maximieren', close: 'Schließen', closeOther: 'Andere Fenster schließen',
            closeAll: 'Alle Fenster schließen'
        };

        const EVENTS = [
            'home-request', 'work-select', 'search-request',
            'sort-windows-request', 'toggle-measures-global', 'toggle-annotations-global',
            'concordance-navigator-toggle-request', 'open-about-request', 'open-help-request', 'language-switch-request',
            'window-focus-request', 'window-minimize-request', 'window-restore-request',
            'window-maximize-request', 'window-close-request', 'active-window-change'
        ];

        for (const type of EVENTS) {
            document.addEventListener(type, (event) => {
                const item = document.createElement('li');
                const name = document.createElement('b');
                name.textContent = type;
                item.append(name, ' ', event.detail === null ? '' : JSON.stringify(event.detail));
                log.prepend(item);
            });
        }

        desktop.addEventListener('desktop-resize', (event) => {
            document.getElementById('metrics').textContent = JSON.stringify(event.detail, null, 1);
        });

        desktop.addEventListener('active-window-change', (event) => {
            const element = windowElements.get(event.detail.id);
            if (element) element.style.zIndex = String(++zIndex);
        });

        let counter = 0;
        function addWindow({ id = `window-${++counter}`, title = `Window ${counter}`, kind = null, special = false, hidden = false } = {}) {
            const usable = desktop.getUsableSize();
            const rect = special
                ? { x: usable.width - 260, y: 10, width: 250, height: 160 }
                : desktop.getSizeAndPosition();
            desktop.registerWindow({ id, title, kind, special, hiddenInTaskbar: special, hidden, rect, icon: special ? 'sync_alt' : 'description' });
            render();
        }

        function render() {
            for (const [id, element] of windowElements) {
                if (!desktop.hasWindow(id)) {
                    element.remove();
                    windowElements.delete(id);
                }
            }

            const activeId = desktop.getActiveWindow()?.id;
            const usable = desktop.getUsableSize();

            for (const win of desktop.getWindows()) {
                let element = windowElements.get(win.id);
                if (!element) {
                    element = document.createElement('section');
                    element.className = 'win';
                    element.innerHTML = `
                        <header>
                            <span></span>
                            <button type="button" data-do="minimize" title="Minimize">_</button>
                            <button type="button" data-do="maximize" title="Maximize / restore">□</button>
                            <button type="button" data-do="close" title="Close">×</button>
                        </header>
                        <div class="body">Fake window standing in for an ExtJS window, rendered into slot="workspace".</div>`;
                    element.style.zIndex = String(++zIndex);
                    element.addEventListener('pointerdown', () => { desktop.setActiveWindow(win.id); render(); });
                    element.querySelector('header').addEventListener('click', (event) => {
                        const action = event.target.dataset.do;
                        const current = desktop.getWindow(win.id);
                        if (action === 'minimize') desktop.updateWindow(win.id, { minimized: true });
                        if (action === 'maximize') desktop.updateWindow(win.id, { maximized: !current.maximized });
                        if (action === 'close') closeWindows([win.id]);
                        render();
                    });
                    workspace.append(element);
                    windowElements.set(win.id, element);
                }

                const rect = win.maximized
                    ? { x: 0, y: 0, width: usable.width, height: usable.height + 10 }
                    : win.rect;
                element.querySelector('header span').textContent = win.title;
                element.hidden = win.hidden || win.minimized;
                element.classList.toggle('active', activeId === win.id);
                Object.assign(element.style, {
                    left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px`
                });
            }
        }

        function closeWindows(ids) {
            for (const id of ids) {
                if (desktop.getWindow(id)?.special) desktop.updateWindow(id, { hidden: true });
                else desktop.unregisterWindow(id);
            }
        }

        function on(type, handler) {
            desktop.addEventListener(type, (event) => { handler(event.detail); render(); });
        }

        on('window-focus-request', ({ id }) => desktop.setActiveWindow(id));
        on('window-minimize-request', ({ id }) => desktop.updateWindow(id, { minimized: true }));
        on('window-restore-request', ({ id }) => {
            desktop.updateWindow(id, { maximized: false });
            desktop.setActiveWindow(id);
        });
        on('window-maximize-request', ({ id }) => {
            desktop.updateWindow(id, { maximized: true });
            desktop.setActiveWindow(id);
        });
        on('window-close-request', ({ ids }) => closeWindows(ids));
        on('sort-windows-request', ({ rects }) => {
            for (const [id, rect] of Object.entries(rects)) desktop.updateWindow(id, { rect });
        });
        on('concordance-navigator-toggle-request', () => {
            if (desktop.concordanceNavigatorOpen) desktop.updateWindow('concordance', { hidden: true });
            else desktop.setActiveWindow('concordance');
        });
        desktop.addEventListener('desktop-resize', render);

        document.getElementById('add-window').addEventListener('click', () => addWindow());
        document.getElementById('toggle-navigator').addEventListener('click', () => {
            if (navigator.isConnected) navigator.remove();
            else desktop.append(navigator);
        });
        document.getElementById('clear-log').addEventListener('click', () => log.replaceChildren());
        document.getElementById('show-clock').addEventListener('change', (e) => { desktop.showClock = e.target.checked; });
        document.getElementById('show-language').addEventListener('change', (e) => desktop.toggleAttribute('show-language-switch', e.target.checked));
        document.getElementById('stretch').addEventListener('change', (e) => { desktop.wallpaperStretch = e.target.checked; });
        document.getElementById('wallpaper').addEventListener('change', (e) => { desktop.wallpaper = e.target.value || null; });
        document.getElementById('language').addEventListener('change', (e) => {
            desktop.lang = e.target.value;
            desktop.labels = e.target.value === 'de' ? GERMAN : {};
        });

        addWindow({ id: 'concordance', title: 'Concordance navigator', kind: CONCORDANCE_NAVIGATOR_KIND, special: true, hidden: true });
        addWindow({ title: 'Score: Freischütz' });
        addWindow({ title: 'Edition text' });
        addWindow({ title: 'Facsimile with a rather long title' });
    </script>
</body>
</html>
